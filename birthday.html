<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photo Word Slideshow</title>
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* Background video style */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    /* Final background image */
    body.final-bg {
      background: url('images/treat-background.jpg') no-repeat center center fixed;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: black and white;
      width: 100%;
      height: 300vh;
      margin: 50px;
      padding: 50px;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: -1;
      display: none;
    }

    .center-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .photo-container {
      max-width: 80vw;
      max-height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      opacity: 0;
      transition: opacity 1.0s ease-in-out;
    }

    .word {
      font-size: 60px; /* Increased from 36px */
      font-weight: bold;
      color:peru;
      margin-top: 20px;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .show {
      opacity: 1;
    }

    .final-message {
      font-size: 40px;
      font-weight: bold;
      color: brown;
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: fadeIn 2s ease forwards;
      text-align: center;
      z-index: 1;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="videos/background.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <!-- Optional dark overlay -->
  <div class="overlay" id="overlay"></div>

  <div class="center-content" id="content">
    <div class="photo-container">
      <img id="photo" src="" alt="Photo" />
    </div>
    <div class="word" id="word"></div>
  </div>

  <div class="final-message" id="finalMessage">
    Treat Marakama<br>Vachirunga 😁
  </div>

  <script>
    const images = [
      "images/img4.jpeg",
      "images/img2.jpeg",
      "images/img3.jpeg",
      "images/img1.jpeg",
      "images/img5.jpeg",
      "images/img6.jpeg",
      "images/img7.jpeg",
      "images/img8.jpeg"
    ];

    const words = [
      "Wishing",
      "u",
      "a",
      "Happiee",
      "Birthday",
      "Jana Anna",
      "(a)",
      "Leo Vaeee"
    ];

    const displayDuration = 2400;
    let currentIndex = 0;

    const photoEl = document.getElementById("photo");
    const wordEl = document.getElementById("word");
    const finalMessageEl = document.getElementById("finalMessage");
    const contentEl = document.getElementById("content");
    const bgVideo = document.getElementById("bg-video");
    const overlay = document.getElementById("overlay");

    // Start immediately after page loads
    window.addEventListener("load", () => {
      showNext();
    });

    function showNext() {
      if (currentIndex >= images.length) {
        photoEl.classList.remove("show");
        wordEl.classList.remove("show");

        setTimeout(() => {
          contentEl.style.display = "none";
          finalMessageEl.style.display = "block";

          bgVideo.pause();
          bgVideo.style.display = "none";

          document.body.classList.add("final-bg");
          overlay.style.display = "block";

          setTimeout(() => {
            window.location.href = "index.html";
          }, 3000);
        }, 300);
        return;
      }

      photoEl.classList.remove("show");
      wordEl.classList.remove("show");

      setTimeout(() => {
        photoEl.src = images[currentIndex];
        wordEl.textContent = words[currentIndex];

        photoEl.onload = () => {
          photoEl.classList.add("show");
          wordEl.classList.add("show");

          currentIndex++;
          setTimeout(showNext, displayDuration);
        };
      }, 300);
    }
  </script>

</body>
</html>
